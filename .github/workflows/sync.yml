name: Sync Pipeline

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/eval_card_backend/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/sync.yml"

env:
  HF_TARGET_DATASET: evaleval/card_backend
  # Pin the registry resolver source for reproducible CI builds. Bump
  # when registry semantics change and we want CI to pick them up.
  RESOLVER_REF: main
  # Pin upstream HF dataset revisions (commit SHAs) so CI runs the
  # pipeline against a KNOWN upstream state. This isolates pipeline code
  # changes from upstream data changes — new data won't flow in until
  # these SHAs are bumped deliberately. Pinned to snapshot last validated
  # on: 2026-08-13. To accept new upstream data, bump the SHA (or remove
  # the var to track latest HEAD).
  # Prev pin: 4fca25c96a4c1015ae662fcd343fefad9951ea06
  # RUNBOOK: an EEE pin bump that includes collection data changes (e.g.
  # the AISI inference-scaling batch) must carry the collection-extractor
  # re-run and the regenerated vendor/collections/** in the SAME PR —
  # canonicalise hard-fails on a manifest/pin mismatch. See
  # notes/collections-spec.md and scripts/collections/.
  EEE_REVISION: 7e54eea02b85eb116c132b3efc444f9e0ed14ff6
  # Prev pin: 0588632449039a9f61f7983d7f2065b918a9e584
  ENTITY_REGISTRY_REVISION: 1846224e38ed090465f3db7fc9fdd2a5ea494c2c
  BENCHMARK_METADATA_REVISION: 0a86cea5b55d6070bd7f1f020f01281e1631adba

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      # Second checkout: the registry's seed/ directory holds the curated
      # composite/family/slice YAMLs that the canonicalise pipeline reads
      # at Stage A (taxonomy.load_and_materialise). Without this, the
      # producer's resolve_seed_dir() returns None and Stage A hard-fails
      # at taxonomy.py — see eval_card_backend/.github/workflows/sync.yml
      # history for why we now check out the registry alongside its
      # resolver package. Pinned to the same RESOLVER_REF so the seed
      # YAMLs travel together with the resolver code that consumes them.
      - name: Check out evalcard-registry (for taxonomy seed YAMLs)
        uses: actions/checkout@v6
        with:
          repository: evaleval/evalcard-registry
          ref: ${{ env.RESOLVER_REF }}
          # Path matches one of the names taxonomy.resolve_seed_dir()
          # walks parents looking for ("evalcard-registry/seed"), so the
          # producer can find it via parent walk even if the env var
          # below goes missing. Both paths point to the same directory —
          # belt and braces.
          path: evalcard-registry

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Configure resolver dep for CI
        run: python3 scripts/ci_install_resolver.py

      - name: Sync dependencies
        run: uv sync --all-groups

      # Stage cache (.cache/canonicalise/) is intentionally NOT cached:
      # production runs always mint fresh snapshot IDs and never invoke
      # --from-stage on prior runs. Caching it would just accumulate
      # stale snapshot dirs.

      # Key incorporates the pinned EEE + cards revisions so a pin change
      # invalidates the cache. When unpinned the revision slots are empty
      # (key collapses to the prior `hf-bulk--` form) and restore-keys
      # fall back to the latest bulk cache.
      - name: Cache EEE + benchmark-cards snapshots
        uses: actions/cache@v5
        with:
          path: |
            .cache/eee_datastore
            .cache/auto_benchmarkcards
          key: hf-bulk-${{ env.EEE_REVISION }}-${{ env.BENCHMARK_METADATA_REVISION }}-${{ github.run_id }}
          restore-keys: |
            hf-bulk-${{ env.EEE_REVISION }}-${{ env.BENCHMARK_METADATA_REVISION }}-
            hf-bulk-

      # Registry cache is keyed on the entity-registry-data revision so a
      # SHA change forces a fresh download (the producer's ensure_snapshot
      # short-circuits on a stale cache otherwise). When ENTITY_REGISTRY_REVISION
      # is pinned, key on the pin; else key on current HEAD so newly-seeded
      # aliases/canonicals are picked up. No restore-keys: a mismatch must miss.
      - name: Resolve entity-registry-data revision
        id: registry-rev
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$ENTITY_REGISTRY_REVISION" ]; then
            SHA="$ENTITY_REGISTRY_REVISION"
          else
            SHA=$(curl -fsSL -H "Authorization: Bearer $HF_TOKEN" "https://huggingface.co/api/datasets/evaleval/entity-registry-data" | jq -r .sha)
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Cache entity-registry snapshot
        uses: actions/cache@v5
        with:
          path: .cache/entity_registry
          key: entity-registry-${{ steps.registry-rev.outputs.sha }}

      - name: Run tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # -v names each test as it starts; --timeout fails a hung test fast
        # with a traceback instead of silently stalling until the job cap.
        run: uv run pytest tests/ -v --timeout=120

      - name: Run canonicalisation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Point the producer's taxonomy loader at the registry checkout
          # done above. resolve_seed_dir() prefers this env var over its
          # parent-walk fallback. The parent-walk would also find the
          # checkout (path: evalcard-registry matches one of the names it
          # searches for), but the explicit env var avoids dependence on
          # cwd and makes the wiring obvious.
          EVALCARD_REGISTRY_SEED_DIR: ${{ github.workspace }}/evalcard-registry/seed
        run: uv run eval-card-backend canonicalise --warehouse warehouse

      - name: Publish warehouse snapshot to HF dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TARGET_DATASET: ${{ env.HF_TARGET_DATASET }}
        run: uv run python scripts/ci_publish_warehouse.py

      - name: Upload snapshot_meta as run artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-meta
          path: warehouse/*/snapshot_meta.json
          if-no-files-found: warn
