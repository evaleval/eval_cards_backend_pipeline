name: Sync Pipeline

on:
  schedule:
    # After the upstream EEE rebuild (done about 10:30 UTC), off the top of
    # the hour.
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the snapshot. Off: run everything, then only compare with the published snapshot."
        type: boolean
        default: true
      allow_shrink:
        description: "Publish even if the snapshot is much smaller than the published one (or the published one cannot be read)."
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "src/eval_card_backend/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/sync.yml"

permissions:
  contents: read

# Every run that publishes shares one group, whatever its ref, so the shrink
# guard's compare-then-upload never overlaps another publisher. Only a manual
# run with publish off gets a per-ref group, so it never queues behind or
# displaces a publishing run.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && format('sync-pipeline-check-{0}', github.ref) || 'sync-pipeline-publish' }}
  cancel-in-progress: false

# Upstream revisions. The EEE datastore and the entity registry data are
# resolved per run by scripts/ci_resolve_revisions.sh: each follows the head
# of its dataset unless the repo variable of the same name (EEE_REVISION,
# ENTITY_REGISTRY_REVISION; Settings > Secrets and variables > Actions >
# Variables) holds a commit sha. Delete the variable to follow head again.
# The resolver and seed checkout (RESOLVER_REF) is not configurable: it is
# the registry repo commit recorded in the selected registry data's
# manifest.json (seed_git_sha).
# Values hardcoded here until 2026-10-04, for pinning back:
#   EEE_REVISION:             0fe996f1b578d43d7e4d16be814c961b6f778445
#   ENTITY_REGISTRY_REVISION: 9405e27e6b7a96fe9721b8b33a80fd349fabf6b9
#   RESOLVER_REF (derived):   d3f2248108de432b3d3ba8669f653510e4b07d4b
env:
  HF_TARGET_DATASET: evaleval/card_backend
  # Private collection source: the UK AISI inference-scaling extract
  # (manifest.json, results.parquet, trajectories.parquet) is served from
  # collections/aisi_inference_scaling/ in the private dataset
  # evaleval/aisi-inference-scaling-data, downloaded into .cache/eee_private
  # (never into the public cache below). EEE_INCLUDE_PRIVATE=1 applies it;
  # the code default is off, and off the pipeline makes no request to that
  # repo. The job's HF_TOKEN needs read access to the private dataset. To
  # update the extract: run scripts/collections/aisi_inference_scaling.py,
  # upload its three files to that folder, then set EEE_PRIVATE_REVISION
  # (a commit sha) to the upload's commit.
  EEE_INCLUDE_PRIVATE: "1"
  EEE_PRIVATE_REVISION: d655e56ca6b90ef85c99777debfcf0119c452788
  # Benchmark cards stay pinned here; bump the sha to accept new cards.
  BENCHMARK_METADATA_REVISION: 0a86cea5b55d6070bd7f1f020f01281e1631adba

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      # Exports EEE_REVISION, ENTITY_REGISTRY_REVISION and RESOLVER_REF for
      # every later step (checkout ref, cache keys, resolver install, the
      # pipeline itself). The repo variables come in under other names so
      # the resolved values can take the names the pipeline reads.
      - name: Resolve upstream revisions
        id: revisions
        env:
          PINNED_EEE_REVISION: ${{ vars.EEE_REVISION }}
          PINNED_ENTITY_REGISTRY_REVISION: ${{ vars.ENTITY_REGISTRY_REVISION }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash scripts/ci_resolve_revisions.sh

      # Second checkout: the registry's seed/ directory holds the curated
      # composite/family/slice YAMLs that the canonicalise pipeline reads
      # at Stage A (taxonomy.load_and_materialise). Without this, the
      # producer's resolve_seed_dir() returns None and Stage A hard-fails
      # at taxonomy.py. Checked out at the same RESOLVER_REF the resolver
      # package is installed from, so the seed YAMLs travel together with
      # the resolver code that consumes them.
      - name: Check out evalcard-registry (for taxonomy seed YAMLs)
        uses: actions/checkout@v6
        with:
          repository: evaleval/evalcard-registry
          ref: ${{ env.RESOLVER_REF }}
          # Path matches one of the names taxonomy.resolve_seed_dir()
          # walks parents looking for ("evalcard-registry/seed"), so the
          # producer can find it via parent walk even if the env var
          # below goes missing. Both paths point to the same directory —
          # belt and braces.
          path: evalcard-registry

      - name: Check the registry checkout has the seed and the resolver
        run: |
          for dir in seed packages/eval-entity-resolver; do
            if [ ! -d "evalcard-registry/$dir" ]; then
              echo "::error::evalcard-registry@${RESOLVER_REF} has no $dir directory"
              exit 1
            fi
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Configure resolver dep for CI
        run: python3 scripts/ci_install_resolver.py

      - name: Sync dependencies
        run: uv sync --all-groups

      # Stage cache (.cache/canonicalise/) is intentionally NOT cached:
      # production runs always mint fresh snapshot IDs and never invoke
      # --from-stage on prior runs. Caching it would just accumulate
      # stale snapshot dirs.

      # Key incorporates the resolved EEE revision and the cards pin so a
      # change in either saves a new cache. restore-keys fall back to the
      # latest bulk cache; against a concrete EEE sha the pipeline re-lists
      # and downloads only the files that changed.
      - name: Cache EEE + benchmark-cards snapshots
        uses: actions/cache@v5
        with:
          path: |
            .cache/eee_datastore
            .cache/auto_benchmarkcards
          key: hf-bulk-${{ steps.revisions.outputs.eee_revision }}-${{ env.BENCHMARK_METADATA_REVISION }}-${{ github.run_id }}
          restore-keys: |
            hf-bulk-${{ steps.revisions.outputs.eee_revision }}-${{ env.BENCHMARK_METADATA_REVISION }}-
            hf-bulk-

      # Registry cache is keyed on the resolved entity-registry-data
      # revision so a sha change forces a fresh download (the producer's
      # ensure_snapshot short-circuits on a stale cache otherwise). No
      # restore-keys: a mismatch must miss.
      - name: Cache entity-registry snapshot
        uses: actions/cache@v5
        with:
          path: .cache/entity_registry
          key: entity-registry-${{ steps.revisions.outputs.entity_registry_revision }}

      # The open-weights backfill looks every unset model id up on the Hub
      # (~2,100 calls) when it has no verdict cache, which exhausts the
      # token's API quota on each run. Keep its verdict file between runs.
      # Only this file: the stage cache around it stays uncached (above).
      - name: Cache open-weights verdicts
        uses: actions/cache@v5
        with:
          path: .cache/canonicalise/hf_openness.json
          key: hf-openness-${{ github.run_id }}
          restore-keys: |
            hf-openness-

      - name: Run tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # -v names each test as it starts; --timeout fails a hung test fast
        # with a traceback instead of silently stalling until the job cap.
        run: uv run pytest tests/ -v --timeout=120

      - name: Run canonicalisation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Point the producer's taxonomy loader at the registry checkout
          # done above. resolve_seed_dir() prefers this env var over its
          # parent-walk fallback. The parent-walk would also find the
          # checkout (path: evalcard-registry matches one of the names it
          # searches for), but the explicit env var avoids dependence on
          # cwd and makes the wiring obvious.
          EVALCARD_REGISTRY_SEED_DIR: ${{ github.workspace }}/evalcard-registry/seed
        run: uv run eval-card-backend canonicalise --warehouse warehouse

      # Schedule and push runs carry no inputs, so they always publish and
      # never override the shrink guard. Only a manual run can turn publish
      # off or the override on.
      - name: Publish warehouse snapshot to HF dataset
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TARGET_DATASET: ${{ env.HF_TARGET_DATASET }}
          ALLOW_SNAPSHOT_SHRINK: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_shrink && '1' || '0' }}
        run: uv run python scripts/ci_publish_warehouse.py

      - name: Compare snapshot with the published one (publish is off)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TARGET_DATASET: ${{ env.HF_TARGET_DATASET }}
          ALLOW_SNAPSHOT_SHRINK: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_shrink && '1' || '0' }}
        run: uv run python scripts/ci_publish_warehouse.py --check-only

      - name: Upload snapshot_meta as run artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-meta
          path: warehouse/*/snapshot_meta.json
          if-no-files-found: warn
