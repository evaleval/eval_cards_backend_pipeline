# How each result was SCORED: from generated text, or from log-probabilities.
#
# This decides which setup fields can even exist for a run. A log-prob result
# scores the model's likelihood over fixed answer choices — nothing is sampled
# and nothing is generated, so temperature and max_tokens are not undisclosed,
# they are ABSENT. Consumers that score reproducibility need the distinction or
# they mark a quarter of the corpus down for knobs it never had.
#
# RESOLUTION ORDER (see stage_j_scoring_mode in canonicalise/stages.py):
#   1. the record's own `output_type`, authoritative and never overridden
#      here. A record that reports it at all is the whole answer: if the
#      value is one we do not recognise the row stays unknown rather than
#      falling back to this file, which has stopped describing it.
#   2. this file, keyed by (composite_slug, benchmark_id), for records that
#      report no output_type at all
#   3. NULL, unknown, which consumers must treat as "cannot say" and never
#      as "generative". Guessing here is worse than abstaining.
#
# Values: log_prob | generative.
#
# NEVER add an entry inferred from a benchmark's NAME. helm_* runs multiple
# choice by generating the answer letter, and is generative. Every entry below
# is read out of the harness's own config dump, not deduced from the title.
#
# CHECKING: scripts/derive_scoring_modes.py re-reads the dumps and reports what
# they say, with --check for CI. It does not write this file: edits are made by
# hand from what it reports, so this stays checkable rather than folklore.

version: 1

sources:
  # HF Open LLM Leaderboard v2 — lm-evaluation-harness.
  #
  # The EEE record carries no output_type; it lives only in the leaderboard's
  # own result dumps (HF dataset open-llm-leaderboard/results, per model, at
  # configs[<task>].output_type). The harness config is fixed per task, so the
  # mapping is a property of the benchmark rather than of any one model —
  # verified identical across 25 independently sampled model dumps on
  # 2026-09-21 (950 task configs, zero disagreements).
  #
  # This covers 17,684 of the 26,526 hf-open-llm-v2 rows in the warehouse,
  # every one of which previously counted as a reproducibility gap for not
  # disclosing a temperature it could not have had.
  hf-open-llm-v2:
    benchmarks:
      bbh:
        mode: log_prob
        harness_tasks: leaderboard_bbh_*
        num_fewshot: 3
      gpqa:
        mode: log_prob
        harness_tasks: leaderboard_gpqa_*
        num_fewshot: 0
      musr:
        mode: log_prob
        harness_tasks: leaderboard_musr_*
        num_fewshot: 0
      mmlu-pro:
        mode: log_prob
        harness_tasks: leaderboard_mmlu_pro
        num_fewshot: 5
      ifeval:
        mode: generative
        harness_tasks: leaderboard_ifeval
        num_fewshot: 0
      math-level-5:
        mode: generative
        harness_tasks: leaderboard_math_*
        num_fewshot: 4

# Sources that state their own scoring, listed so nobody adds a duplicate
# entry for them here:
#   swissai-apertus-evals  generation_config.additional_details.output_type,
#                          which step 1 above reads
#   reward-bench           model_info.additional_details.model_type
#                          (Seq. Classifier / Custom Classifier / DPO are
#                           log-prob; Generative / Generative RM are not).
#                          NOT resolved today: eval_results_view's model_info
#                          struct does not carry additional_details, so that
#                          path needs its own change. Do not paper over it
#                          with an entry here.
#
# Same harness family, NOT yet checked against their dumps — deliberately
# absent rather than guessed: open-medical-llm, lexam, delta_nc, lingoly_*.
